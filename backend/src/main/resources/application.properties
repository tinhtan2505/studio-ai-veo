spring.application.name=studio-ai-omni-backend
server.port=6661

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=2MB

app.omni.api-key=${GEMINI_API_KEY:}
app.omni.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
app.omni.output-dir=${APP_OMNI_OUTPUT_DIR:data/omni-output}
app.omni.max-upload-bytes=${APP_OMNI_MAX_UPLOAD_BYTES:2147483648}
app.omni.max-concurrent-jobs=${APP_OMNI_MAX_CONCURRENT_JOBS:2}
app.omni.job-retention-hours=${APP_OMNI_JOB_RETENTION_HOURS:24}
app.omni.request-timeout-minutes=${APP_OMNI_REQUEST_TIMEOUT_MINUTES:30}
app.omni.output-poll-seconds=${APP_OMNI_OUTPUT_POLL_SECONDS:5}
app.omni.output-poll-timeout-minutes=${APP_OMNI_OUTPUT_POLL_TIMEOUT_MINUTES:30}
